
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealSync | Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #d9f3f5, #e8edff);
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #087f8c;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #087f8c;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #087f8c;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #05636d;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
            padding: 11px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            line-height: 2;
        }

        .links a {
            color: #087f8c;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>HealSync</h1>

        <p class="subtitle">
            Smart Hospital Queue Management System
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        {% if success %}
            <div style="background:#e4f7e9;color:#176b35;padding:10px;border-radius:6px;margin-bottom:15px;text-align:center;">
                {{ success }}
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">

            <label for="role">Login As</label>

            <select name="role" id="role" required>
                <option value="patient">Patient</option>
                <option value="admin">Administrator</option>
            </select>

            <label for="email">
                Email / Administrator ID
            </label>

            <input
                type="text"
                id="email"
                name="email"
                placeholder="Enter your email or admin ID"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <div class="links">

            <p>
                New patient?
                <a href="{{ url_for('register') }}">
                    Register here
                </a>
            </p>

            <p>
                <a href="{{ url_for('home') }}">
                    Back to Home
                </a>
            </p>

        </div>

    </div>

</body>
</html>
