
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Token | HealSync</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #eef7f8;
            color: #17324d;
        }

        nav {
            background: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: #087e8b;
            margin: 0;
        }

        nav a {
            color: #087e8b;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 550px;
            background: white;
            margin: 55px auto;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px #00000015;
        }

        h1 {
            text-align: center;
            color: #087e8b;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccd9df;
            border-radius: 6px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #087e8b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #066570;
        }

        .error {
            color: #c62828;
            text-align: center;
        }
    </style>
</head>

<body>

    <nav>
        <h2>HealSync</h2>
        <a href="{{ url_for('patient_dashboard') }}">Dashboard</a>
    </nav>

    <div class="container">

        <h1>Book Hospital Token</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('book_token') }}">

            <label for="department">Select Department</label>

            <select name="department" id="department" required>
                <option value="">Choose Department</option>

                {% for department in departments %}
                    <option value="{{ department }}">
                        {{ department }}
                    </option>
                {% endfor %}

            </select>

            <label for="visit_date">Visit Date</label>

            <input
                type="date"
                name="visit_date"
                id="visit_date"
                required
            >

            <label for="symptoms">Symptoms</label>

            <textarea
                name="symptoms"
                id="symptoms"
                placeholder="Enter your symptoms"
                required
            ></textarea>

            <button type="submit">Book Token</button>

        </form>

    </div>

</body>
</html>
