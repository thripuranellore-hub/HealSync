
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | HealSync</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
<div class="auth-card">
    <a class="brand" href="{{ url_for('home') }}">HealSync</a>
    <h1>Create your account</h1>
    <p class="muted">Register to book and manage hospital tokens.</p>

    {% if error %}
        <div class="alert error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('register') }}">
        <label>Full name</label>
        <input type="text" name="name" placeholder="Enter your full name" required>

        <label>Email address</label>
        <input type="email" name="email" placeholder="Enter your email" required>

        <label>Phone number</label>
        <input type="tel" name="phone" placeholder="10-digit phone number"
               pattern="[0-9]{10}" maxlength="10" required>

        <label>Password</label>
        <input type="password" name="password"
               placeholder="At least 6 characters" minlength="6" required>

        <label>Confirm password</label>
        <input type="password" name="confirm_password"
               placeholder="Enter password again" minlength="6" required>

        <button class="btn full-width" type="submit">Create Account</button>
    </form>

    <p class="form-bottom">Already registered?
        <a href="{{ url_for('login') }}">Login here</a>
    </p>
    <a class="back-link" href="{{ url_for('home') }}">← Back to Home</a>
</div>
</body>
</html>
